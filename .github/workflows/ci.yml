name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project apps/desktop-tests/PersonalCommandCenter.Desktop.Tests.csproj
      - run: dotnet publish apps/desktop/PersonalCommandCenter.Desktop.csproj -c Release -p:PublishProfile=win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: personal-command-center-windows-x64
          path: artifacts/windows-x64/
