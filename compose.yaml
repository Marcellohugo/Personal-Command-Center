services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-personal_command_center}?schema=public
      APP_URL: ${APP_URL:-http://localhost:3001}
      TZ: ${TZ:-Asia/Bangkok}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      APP_USER_EMAIL: ${APP_USER_EMAIL:-demo@example.com}
      APP_USER_NAME: ${APP_USER_NAME:-Pengguna Utama}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_TIMEZONE: ${GOOGLE_CALENDAR_TIMEZONE:-Asia/Bangkok}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_command_center}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  notifier:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command: >-
      sh -c 'while true; do
      wget -qO- --header="Authorization: Bearer $${CRON_SECRET}" --post-data="" http://app:3000/api/notifications/run >/dev/null || true;
      sleep 60;
      done'
    depends_on:
      app:
        condition: service_started

volumes:
  postgres_data:
